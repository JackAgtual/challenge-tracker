name: Containerize
description: Build and push api and web images to GHCR

inputs:
  actor:
    description: Username used to log in to GHCR
    required: true
  github_token:
    description: GitHub token used to log in to GHCR
    required: true
  dhi_username:
    description: Username to log in to dhi.io
    required: true
  dhi_token:
    description: DockerHub token to log in to dhi.io
    required: true

runs:
  using: composite
  steps:
    - name: Login to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.actor }}
        password: ${{ inputs.github_token }}

    - name: Login to dhi.io
      uses: docker/login-action@v4
      with:
        registry: dhi.io
        username: ${{ inputs.dhi_username }}
        password: ${{ inputs.dhi_token }}

    - name: Build and push api
      uses: docker/build-push-action@v7
      with:
        context: ./api
        push: true
        tags: ghcr.io/jackagtual/challenge-tracker-api:latest

    - name: Build and push web
      uses: docker/build-push-action@v7
      with:
        context: ./web
        push: true
        tags: ghcr.io/jackagtual/challenge-tracker-web:latest
