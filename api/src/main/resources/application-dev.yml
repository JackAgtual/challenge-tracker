spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: admin
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
